<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d38">
<meta name="color-scheme" content="dark">
<meta name="description" content="Puffling Flight: an original one-button flying game. 小海鹦飞飞：一款原创的单键飞行小游戏。">
<title>Puffling Flight · 小海鹦飞飞</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="stage" data-state="menu">
  <canvas id="game" role="img" data-i18n-aria="ariaCanvas"></canvas>

  <div id="hud">
    <div id="score" aria-hidden="true">0</div>
    <div id="countdown" aria-hidden="true"></div>
  </div>

  <div id="corner">
    <button id="btn-lang" class="chip" type="button" data-i18n="langToggle" data-i18n-aria="ariaLang"></button>
    <button id="btn-pause" class="icon-btn" type="button" data-i18n-aria="ariaPause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <section id="screen-menu" class="screen" aria-labelledby="menu-title">
    <div class="menu-top">
      <h1 id="menu-title" class="game-title" data-i18n="title"></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="menu-bottom">
      <button id="btn-play" class="btn btn-primary" type="button" data-i18n="play"></button>
      <button id="btn-settings-menu" class="btn" type="button" data-i18n="settings"></button>
      <p class="best-line"><span data-i18n="best"></span> <strong id="menu-best">0</strong></p>
      <p class="hint" id="menu-hint"></p>
      <p class="keys" data-i18n="keysHelp"></p>
      <p class="credits" data-i18n="credits"></p>
    </div>
  </section>

  <section id="screen-ready" class="screen screen-pass" aria-labelledby="ready-title">
    <p id="ready-title" class="ready-title" data-i18n="getReady"></p>
    <div class="ready-bottom">
      <div class="tap-icon" aria-hidden="true"></div>
      <p class="hint" id="ready-hint"></p>
    </div>
  </section>

  <section id="screen-pause" class="screen" role="dialog" aria-labelledby="pause-title">
    <div class="panel">
      <h2 id="pause-title" data-i18n="paused"></h2>
      <button id="btn-resume" class="btn btn-primary" type="button" data-i18n="resume"></button>
      <button id="btn-restart" class="btn" type="button" data-i18n="restart"></button>
      <button id="btn-pause-settings" class="btn" type="button" data-i18n="settings"></button>
      <button id="btn-pause-menu" class="btn" type="button" data-i18n="menu"></button>
    </div>
  </section>

  <section id="screen-over" class="screen" role="dialog" aria-labelledby="over-title">
    <div class="panel">
      <h2 id="over-title" data-i18n="gameOver"></h2>
      <div class="result">
        <div id="medal" class="medal none" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle class="medal-disc" cx="32" cy="32" r="28"/><path class="medal-star" d="M32 14l5.3 11.6 12.7 1.4-9.5 8.6 2.7 12.5L32 41.7 20.8 48.1l2.7-12.5-9.5-8.6 12.7-1.4z"/></svg>
        </div>
        <dl class="scores">
          <div><dt data-i18n="score"></dt><dd id="over-score">0</dd></div>
          <div><dt data-i18n="best"></dt><dd id="over-best">0</dd></div>
        </dl>
      </div>
      <p id="medal-name" class="medal-name" data-i18n="medalNone"></p>
      <p id="new-best" class="new-best" data-i18n="newBest" hidden></p>
      <button id="btn-again" class="btn btn-primary" type="button" data-i18n="playAgain"></button>
      <button id="btn-over-menu" class="btn" type="button" data-i18n="menu"></button>
    </div>
  </section>

  <section id="screen-settings" class="screen" role="dialog" aria-labelledby="settings-title">
    <div class="panel">
      <h2 id="settings-title" data-i18n="settings"></h2>
      <div class="setting-row"><span id="lbl-sfx" data-i18n="sound"></span><button id="set-sfx" class="toggle" type="button" role="switch" aria-checked="true" aria-labelledby="lbl-sfx"></button></div>
      <div class="setting-row"><span id="lbl-music" data-i18n="music"></span><button id="set-music" class="toggle" type="button" role="switch" aria-checked="true" aria-labelledby="lbl-music"></button></div>
      <div class="setting-row"><span id="lbl-motion" data-i18n="reduceMotion"></span><button id="set-motion" class="toggle" type="button" role="switch" aria-checked="false" aria-labelledby="lbl-motion"></button></div>
      <div class="setting-row"><span id="lbl-lang" data-i18n="language"></span>
        <div class="seg" role="group" aria-labelledby="lbl-lang">
          <button id="set-lang-en" type="button" lang="en" aria-pressed="true" data-i18n="langNameEn"></button>
          <button id="set-lang-zh" type="button" lang="zh-Hans" aria-pressed="false" data-i18n="langNameZh"></button>
        </div>
      </div>
      <button id="btn-reset-best" class="btn btn-small btn-danger" type="button" data-i18n="resetBest"></button>
      <button id="btn-settings-back" class="btn btn-primary" type="button" data-i18n="back"></button>
    </div>
  </section>

  <p id="live" class="sr-only" aria-live="polite"></p>
</div>
<noscript><p class="noscript">Puffling Flight needs JavaScript. 小海鹦飞飞需要启用 JavaScript。</p></noscript>
</body>
</html>
